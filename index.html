                  </div>
                </div>

                {/* 2. Bake, Cut & Crust Preferences ($0.00 Kitchen Prep Mods) */}
                <div className="space-y-1.5 text-xs">
                  <span className="font-condensed uppercase tracking-wider font-bold text-bucky-charcoal block">
                    2. Bake, Cut & Crust Instructions (No Charge)
                  </span>
                  <div className="flex flex-wrap gap-1.5">
                    {TOAST_PREP_MODIFIERS.map(mod => {
                      const isActive = customPrepMods.includes(mod.id);
                      return (
                        <button
                          key={mod.id}
                          type="button"
                          onClick={() => toggleCustomPrepMod(mod.id)}
                          className={`px-2.5 py-1.5 font-condensed uppercase tracking-wider text-[11px] font-bold border transition ${
                            isActive
                              ? "bg-bucky-charcoal text-white border-bucky-charcoal"
                              : "bg-white hover:bg-stone-100 text-bucky-charcoal border-stone-300"
                          }`}
                        >
                          {mod.name}
                        </button>
                      );
                    })}
                  </div>
                </div>

                {/* 3. Dipping Cups & Side Sauces */}
                <div className="space-y-1.5 text-xs">
                  <span className="font-condensed uppercase tracking-wider font-bold text-bucky-charcoal block">
                    3. Add Dipping Cups & Side Sauces
                  </span>
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-1.5">
                    {TOAST_DIP_SIDES.map(side => {
                      const isActive = customDipSides.includes(side.id);
                      return (
                        <button
                          key={side.id}
                          type="button"
                          onClick={() => toggleCustomDipSide(side.id)}
                          className={`p-2 text-left border flex items-center justify-between transition ${
                            isActive
                              ? "bg-bucky-red text-white border-bucky-charcoal font-bold"
                              : "bg-white hover:bg-stone-100 text-bucky-charcoal border-stone-300"
                          }`}
                        >
                          <span>{side.name}</span>
                          <span className="font-mono text-[11px]">+${side.price.toFixed(2)}</span>
                        </button>
                      );
                    })}
                  </div>
                </div>

                {/* 4. Special Kitchen / Allergy Notes */}
                <div className="space-y-1.5 text-xs">
                  <div className="flex items-center justify-between">
                    <label className="font-condensed uppercase tracking-wider font-bold text-bucky-charcoal">
                      4. Special Kitchen / Allergy Instructions
                    </label>
                    <div className="flex gap-1">
                      {["⚠️ Nut Allergy", "⚠️ Gluten Sensitivity", "👶 Kids Cut"].map(tag => (
                        <button
                          key={tag}
                          type="button"
                          onClick={() =>
                            setCustomItemNote(prev => (prev ? `${prev} • ${tag}` : tag))
                          }
                          className="px-1.5 py-0.5 bg-amber-100 hover:bg-amber-200 border border-amber-700 text-amber-950 font-condensed text-[10px] font-bold"
                        >
                          +{tag}
                        </button>
                      ))}
                    </div>
                  </div>
                  <input
                    type="text"
                    placeholder="e.g. Light cheese on left half, severe tree nut allergy..."
                    value={customItemNote}
                    onChange={e => setCustomItemNote(e.target.value)}
                    className="w-full px-3 py-2 bg-white border-2 border-bucky-charcoal text-xs"
                  />
                </div>

                {/* Footer: Quantity Stepper & Add Customized Item to Order */}
                <div className="pt-3 border-t-2 border-bucky-charcoal flex flex-wrap items-center justify-between gap-3">
                  <div className="flex items-center gap-2">
                    <span className="font-condensed uppercase text-xs font-bold">Qty:</span>
                    <button
                      type="button"
                      onClick={() => setCustomItemQty(q => Math.max(1, q - 1))}
                      className="w-7 h-7 bg-white border border-bucky-charcoal font-bold"
                    >
                      -
                    </button>
                    <span className="font-display font-black text-sm w-6 text-center">{customItemQty}</span>
                    <button
                      type="button"
                      onClick={() => setCustomItemQty(q => q + 1)}
                      className="w-7 h-7 bg-white border border-bucky-charcoal font-bold"
                    >
                      +
                    </button>
                  </div>

                  <button
                    type="submit"
                    className="px-6 py-2.5 bg-bucky-red hover:bg-bucky-darkred text-white font-condensed uppercase tracking-widest text-xs font-extrabold border-2 border-bucky-charcoal vintage-shadow-sm"
                  >
                    + Add Customized Item ($
                    {((customizingItem.price + customModalModifiersPreview.modUpcharge) * customItemQty).toFixed(2)})
                  </button>
                </div>
              </form>
            </div>
          )}

          {/* 80MM THERMAL KITCHEN CHIT & GUEST RECEIPT PRINTER MODAL */}
          {printingOrder && (
            <div className="fixed inset-0 bg-black/75 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div
                id="bucky-printable-receipt"
                className="bg-white text-bucky-charcoal border-4 border-bucky-charcoal max-w-sm w-full p-6 space-y-4 vintage-shadow font-mono text-xs max-h-[92vh] overflow-y-auto"
              >
                <div className="text-center border-b-2 border-dashed border-bucky-charcoal pb-3 space-y-0.5">
                  <div className="font-display font-black text-lg tracking-tight">
                    BUCKY’S REAL GOOD PIZZA
                  </div>
                  <div>465 Main Street • Chatham, NJ 07928</div>
                  <div>(973) 200-2388 • buckysrealgoodpizza.com</div>
                  <div className="pt-2 font-bold text-sm">
                    {printingOrder.id} ({printingOrder.source} • {printingOrder.diningOption || "PICKUP"})
                  </div>
                  <div>
                    Guest: <strong>{printingOrder.customerName}</strong> ({printingOrder.customerPhone})
                  </div>
                  <div>
                    Ordered: {printingOrder.createdAt} | Promised: <strong>{printingOrder.promisedTime}</strong>
                  </div>
                  {printingOrder.curbsideVehicle && (
                    <div className="font-bold">🚗 Curbside Car: {printingOrder.curbsideVehicle}</div>
                  )}
                </div>

                {/* Itemized Lines + Modifiers */}
                <div className="space-y-2 border-b-2 border-dashed border-bucky-charcoal pb-3">
                  {(printingOrder.items || []).map((item, idx) => (
                    <div key={idx} className="space-y-0.5">
                      <div className="flex justify-between font-bold">
                        <span>
                          {item.quantity}x {item.name}
                        </span>
                        <span>${((item.price || 0) * (item.quantity || 1)).toFixed(2)}</span>
                      </div>
                      {item.modifiers &&
                        item.modifiers.map(m => (
                          <div key={m.id} className="pl-3 text-[11px] text-stone-700">
                            + {m.label}
                          </div>
                        ))}
                      {item.specialNote && (
                        <div className="pl-3 text-[11px] font-bold">
                          * NOTE: {item.specialNote}
                        </div>
                      )}
                    </div>
                  ))}
                  {printingOrder.orderKitchenNote && (
                    <div className="pt-1 font-bold">
                      * ORDER NOTE: {printingOrder.orderKitchenNote}
                    </div>
                  )}
                </div>

                {/* Receipt Totals */}
                {(() => {
                  const fin = computeOrderFinancials(printingOrder);
                  return (
                    <div className="space-y-1 border-b-2 border-dashed border-bucky-charcoal pb-3">
                      <div className="flex justify-between">
                        <span>Subtotal</span>
                        <span>${fin.subtotal.toFixed(2)}</span>
                      </div>
                      {printingOrder.discountAmount > 0 && (
                        <div className="flex justify-between">
                          <span>Discount ({printingOrder.discountLabel})</span>
                          <span>-${printingOrder.discountAmount.toFixed(2)}</span>
                        </div>
                      )}
                      <div className="flex justify-between">
                        <span>NJ Sales Tax (6.625%)</span>
                        <span>${fin.taxAmount.toFixed(2)}</span>
                      </div>
                      <div className="flex justify-between">
                        <span>Tip</span>
                        <span>${fin.tipAmount.toFixed(2)}</span>
                      </div>
                      <div className="flex justify-between font-bold text-sm pt-1">
                        <span>TOTAL PAID ({printingOrder.paymentMethod})</span>
                        <span>${fin.totalAmount.toFixed(2)}</span>
                      </div>
                    </div>
                  );
                })()}

                <div className="text-center text-[11px] text-stone-500">
                  Thank you for supporting our family pizzeria in Chatham!
                </div>

                <div className="grid grid-cols-2 gap-2 pt-1 font-sans no-print">
                  <button
                    type="button"
                    onClick={() => window.print()}
                    className="py-2 bg-bucky-red hover:bg-bucky-darkred text-white font-condensed uppercase tracking-wider text-xs font-bold border border-bucky-charcoal"
                  >
                    🖨️ Print Chit / Receipt
                  </button>
                  <button
                    type="button"
                    onClick={() => setPrintingOrder(null)}
                    className="py-2 bg-bucky-charcoal hover:bg-stone-800 text-white font-condensed uppercase tracking-wider text-xs font-bold border border-bucky-charcoal"
                  >
                    Close
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ================================================================= */}
          {/* MASTER STORE OPENED / CLOSED & WEEKLY STORE HOURS SETTINGS MODAL  */}
          {/* ================================================================= */}
          {isStoreHoursModalOpen && (
            <div className="fixed inset-0 bg-black/75 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-bucky-cream text-bucky-charcoal border-4 border-bucky-charcoal max-w-3xl w-full p-6 space-y-5 vintage-shadow max-h-[92vh] overflow-y-auto">
                <div className="flex items-start justify-between border-b-2 border-bucky-charcoal pb-3">
                  <div>
                    <div className="flex flex-wrap items-center gap-2">
                      <span className="font-condensed uppercase tracking-widest text-xs text-bucky-red font-bold">
                        465 Main St, Chatham NJ • Master Store Availability
                      </span>
                      <span
                        className={`px-2 py-0.5 font-condensed uppercase text-[10px] tracking-wider font-bold border ${
                          storeStatusInfo.isStoreOpen
                            ? "bg-emerald-800 text-white border-emerald-950"
                            : "bg-bucky-red text-white border-bucky-charcoal"
                        }`}
                      >
                        {storeStatusInfo.isStoreOpen ? "🟢 LIVE STATUS: OPEN" : "🔴 LIVE STATUS: CLOSED"}
                      </span>
                    </div>
                    <h3 className="font-display font-black text-2xl mt-1">
                      ⚙️ Master Opened/Closed & Store Hours Settings
                    </h3>
                    <p className="text-xs text-stone-600 mt-0.5">
                      Control whether Bucky’s Online Storefront is open or closed, customize the closed banner message, and configure daily operating hours. Changes sync live across all customer & staff screens.
                    </p>
                  </div>
                  <button
                    type="button"
                    onClick={() => setIsStoreHoursModalOpen(false)}
                    className="text-stone-500 hover:text-bucky-charcoal font-bold text-lg px-1"
                  >
                    ✕
                  </button>
                </div>

                {/* 1. MASTER STORE OPEN / CLOSED / AUTO SWITCH */}
                <div className="bg-white border-2 border-bucky-charcoal p-4 space-y-3 text-xs">
                  <div className="flex flex-wrap items-center justify-between gap-2">
                    <span className="font-condensed uppercase tracking-wider font-bold text-sm text-bucky-charcoal">
                      1. Master Store Opened / Closed Override
                    </span>
                    <span className="text-[11px] text-stone-600">
                      Today ({storeStatusInfo.todaySchedule.label}): <strong>{storeStatusInfo.todayHoursFormatted}</strong>
                    </span>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-2.5">
                    {[
                      {
                        id: "OPEN",
                        title: "🟢 Master OPEN",
                        subtitle: "Accepting online & POS orders right now regardless of clock",
                        activeClass: "bg-emerald-800 text-white border-bucky-charcoal vintage-shadow-sm"
                      },
                      {
                        id: "CLOSED",
                        title: "🔴 Master CLOSED",
                        subtitle: "Pause online ordering immediately (Sold Out / Kitchen Snooze / Closed)",
                        activeClass: "bg-bucky-red text-white border-bucky-charcoal vintage-shadow-sm"
                      },
                      {
                        id: "AUTO",
                        title: "🕒 Auto by Store Hours",
                        subtitle: `Follow weekly schedule below (Currently: ${storeStatusInfo.isAutoOpenNow ? "OPEN" : "CLOSED"})`,
                        activeClass: "bg-bucky-charcoal text-white border-bucky-charcoal vintage-shadow-sm"
                      }
                    ].map(card => {
                      const isSel = storeStatusInfo.mode === card.id;
                      return (
                        <button
                          key={card.id}
                          type="button"
                          onClick={() => setMasterStoreMode(card.id)}
                          className={`p-3 text-left border-2 transition flex flex-col justify-between ${
                            isSel
                              ? card.activeClass
                              : "bg-bucky-cream hover:bg-bucky-parchment text-bucky-charcoal border-stone-300"
                          }`}
                        >
                          <div className="font-display font-black text-base">{card.title}</div>
                          <div className={`text-[11px] mt-1 leading-snug ${isSel ? "text-stone-100" : "text-stone-600"}`}>
                            {card.subtitle}
                          </div>
                        </button>
                      );
                    })}
                  </div>
                </div>

                {/* 2. CLOSED BANNER MESSAGE & PRE-ORDER POLICY */}
                <div className="bg-bucky-parchment border-2 border-bucky-charcoal p-4 space-y-3 text-xs">
                  <div className="flex flex-wrap items-center justify-between gap-2">
                    <label className="font-condensed uppercase tracking-wider font-bold text-sm text-bucky-charcoal">
                      2. Customer Banner Message When Closed & Pre-Order Policy
                    </label>
                    <label className="inline-flex items-center gap-1.5 cursor-pointer font-bold text-bucky-charcoal">
                      <input
                        type="checkbox"
                        checked={Boolean(storeSettings?.allowScheduledPreOrdersWhenClosed)}
                        onChange={e => updateStoreSettingsField("allowScheduledPreOrdersWhenClosed", e.target.checked)}
                        className="accent-bucky-red w-4 h-4"
                      />
                      <span>Allow Scheduled Pre-Orders When Closed</span>
                    </label>
                  </div>

                  <input
                    type="text"
                    value={storeSettings?.closedBannerMessage || ""}
                    onChange={e => updateStoreSettingsField("closedBannerMessage", e.target.value)}
                    placeholder="Enter custom banner message shown to online guests when closed..."
                    className="w-full px-3 py-2 bg-white border-2 border-bucky-charcoal text-xs font-medium"
                  />

                  <div className="flex flex-wrap items-center gap-1.5">
                    <span className="font-condensed uppercase text-[10px] text-stone-600 font-bold">
                      Quick Presets:
                    </span>
                    {[
                      {
                        label: "🌙 Standard Closed",
                        msg: "We are currently closed for online ordering. Check our store hours below or visit us during service!"
                      },
                      {
                        label: "🍕 Sold Out of Dough",
                        msg: "🔥 Sold out of our 72-hr cold-fermented sourdough for tonight! Thank you, Chatham — see you tomorrow!"
                      },
                      {
                        label: "⏸️ 20m Oven Snooze",
                        msg: "⏸️ Online ordering temporarily paused for ~20 mins so our 30-year-old deck ovens can catch up!"
                      },
                      {
                        label: "🎄 Holiday Closure",
                        msg: "🎄 Closed today for a family holiday — we look forward to firing pies for you when we reopen!"
                      }
                    ].map(p => (
                      <button
                        key={p.label}
                        type="button"
                        onClick={() => updateStoreSettingsField("closedBannerMessage", p.msg)}
                        className="px-2 py-1 bg-white hover:bg-stone-100 border border-bucky-charcoal font-condensed uppercase text-[10px] font-bold"
                      >
                        {p.label}
                      </button>
                    ))}
                  </div>
                </div>

                {/* 3. WEEKLY STORE OPERATING HOURS SCHEDULE */}
                <div className="bg-white border-2 border-bucky-charcoal p-4 space-y-3 text-xs">
                  <div className="flex flex-wrap items-center justify-between gap-2 border-b border-stone-200 pb-2.5">
                    <div>
                      <span className="font-condensed uppercase tracking-wider font-bold text-sm text-bucky-charcoal block">
                        3. Weekly Store Hours Schedule (Monday – Sunday)
                      </span>
                      <span className="text-[11px] text-stone-500">
                        Updates website footer hours, live Auto Open/Close schedule, and scheduled pickup time slots.
                      </span>
                    </div>
                    <div className="flex flex-wrap items-center gap-1.5">
                      <button
                        type="button"
                        onClick={() => applyBulkStoreHoursPreset("COPY_TUE_TO_WEEK")}
                        className="px-2.5 py-1 bg-bucky-cream hover:bg-bucky-parchment border border-bucky-charcoal font-condensed uppercase text-[10px] font-bold"
                        title="Copy Tuesday open/close times to Tuesday through Saturday"
                      >
                        📋 Copy Tue Hours to Tue–Sat
                      </button>
                      <button
                        type="button"
                        onClick={() => applyBulkStoreHoursPreset("OPEN_ALL_7_DAYS")}
                        className="px-2.5 py-1 bg-bucky-cream hover:bg-bucky-parchment border border-bucky-charcoal font-condensed uppercase text-[10px] font-bold"
                      >
                        ✓ Open All 7 Days
                      </button>
                      <button
                        type="button"
                        onClick={() => applyBulkStoreHoursPreset("RESET_DEFAULT")}
                        className="px-2.5 py-1 bg-stone-200 hover:bg-stone-300 border border-bucky-charcoal font-condensed uppercase text-[10px] font-bold"
                      >
                        ↺ Reset Default Hours
                      </button>
                    </div>
                  </div>

                  <div className="divide-y divide-stone-200">
                    {(storeSettings?.weeklyHours || DEFAULT_STORE_SETTINGS.weeklyHours).map(day => {
                      const isToday = day.dayIndex === storeStatusInfo.todaySchedule.dayIndex;
                      return (
                        <div
                          key={day.key}
                          className={`py-2.5 px-2 grid grid-cols-1 sm:grid-cols-12 items-center gap-2.5 ${
                            isToday ? "bg-amber-50/80" : ""
                          }`}
                        >
                          {/* Day Name */}
                          <div className="sm:col-span-3 flex items-center gap-2">
                            <span className="font-display font-bold text-sm text-bucky-charcoal">
                              {day.label}
                            </span>
                            {isToday && (
                              <span className="px-1.5 py-0.5 bg-bucky-red text-white font-condensed uppercase text-[9px] font-bold">
                                TODAY
                              </span>
                            )}
                          </div>

                          {/* Open / Closed Day Toggle */}
                          <div className="sm:col-span-2">
                            <button
                              type="button"
                              onClick={() => updateDayScheduleField(day.key, "isOpen", !day.isOpen)}
                              className={`w-full py-1 px-2 font-condensed uppercase tracking-wider text-[11px] font-bold border transition ${
                                day.isOpen
                                  ? "bg-emerald-800 text-white border-bucky-charcoal"
                                  : "bg-stone-300 text-stone-700 border-stone-400"
                              }`}
                            >
                              {day.isOpen ? "✓ Open" : "✕ Closed"}
                            </button>
                          </div>

                          {/* Open Time & Close Time Inputs */}
                          {day.isOpen ? (
                            <div className="sm:col-span-4 flex items-center gap-1.5">
                              <input
                                type="time"
                                value={day.openTime}
                                onChange={e => updateDayScheduleField(day.key, "openTime", e.target.value)}
                                className="px-2 py-1 bg-bucky-cream border border-bucky-charcoal font-mono text-xs font-bold"
                              />
                              <span className="text-stone-500 font-bold">to</span>
                              <input
                                type="time"
                                value={day.closeTime}
                                onChange={e => updateDayScheduleField(day.key, "closeTime", e.target.value)}
                                className="px-2 py-1 bg-bucky-cream border border-bucky-charcoal font-mono text-xs font-bold"
                              />
                            </div>
                          ) : (
                            <div className="sm:col-span-4 text-stone-500 italic text-[11px]">
                              Closed all day ({formatTime24To12(day.openTime)} – {formatTime24To12(day.closeTime)} inactive)
                            </div>
                          )}

                          {/* Day Note */}
                          <div className="sm:col-span-3">
                            <input
                              type="text"
                              placeholder="Optional note (e.g. Resting Ovens)"
                              value={day.note || ""}
                              onChange={e => updateDayScheduleField(day.key, "note", e.target.value)}
                              className="w-full px-2 py-1 bg-white border border-stone-300 text-[11px]"
                            />
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>

                <div className="flex flex-wrap items-center justify-between gap-3 pt-2 border-t-2 border-bucky-charcoal">
                  <div className="text-xs text-stone-600">
                    Current Effective Status:{" "}
                    <strong className={storeStatusInfo.isStoreOpen ? "text-emerald-800" : "text-bucky-red"}>
                      {storeStatusInfo.isStoreOpen ? "OPEN FOR ONLINE ORDERS" : "CLOSED FOR ASAP ONLINE ORDERS"}
                    </strong>{" "}
                    (Mode: <strong>{storeStatusInfo.mode}</strong>)
                  </div>
                  <button
                    type="button"
                    onClick={() => setIsStoreHoursModalOpen(false)}
                    className="px-6 py-2.5 bg-bucky-red hover:bg-bucky-darkred text-white font-condensed uppercase tracking-widest text-xs font-extrabold border-2 border-bucky-charcoal vintage-shadow-sm"
                  >
                    ✓ Save & Close Store Hours Settings
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<BuckysSystemApp />);
  </script>
</body>
</html>
