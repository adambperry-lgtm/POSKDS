    function formatTime24To12(time24) {
      if (!time24 || typeof time24 !== "string" || !time24.includes(":")) return time24 || "";
      const [hStr, mStr] = time24.split(":");
      const h = parseInt(hStr, 10);
      const m = mStr || "00";
      if (Number.isNaN(h)) return time24;
      const ampm = h >= 12 ? "PM" : "AM";
      const h12 = h % 12 === 0 ? 12 : h % 12;
      return `${h12}:${m} ${ampm}`;
    }

    function buildDateAtHHMM(baseDate, dayOffset, hhmm) {
      const d = new Date(baseDate);
      d.setDate(d.getDate() + dayOffset);
      const [hStr, mStr] = (hhmm || "12:00").split(":");
      d.setHours(parseInt(hStr, 10) || 0, parseInt(mStr, 10) || 0, 0, 0);
      return d;
    }

    function resolveNextOpeningAndServiceWindow(storeSettings, nowMs) {
      const now = new Date(nowMs || Date.now());
      const hoursList = storeSettings?.weeklyHours || DEFAULT_STORE_SETTINGS.weeklyHours;
      const todaySchedule = hoursList.find(d => d.dayIndex === now.getDay()) || hoursList[0];

      const todayOpenDate = buildDateAtHHMM(now, 0, todaySchedule.openTime || "12:00");
      const todayCloseDate = buildDateAtHHMM(now, 0, todaySchedule.closeTime || "20:00");

      // Case 1: Currently inside today's open operating window
      if (todaySchedule.isOpen && now >= todayOpenDate && now < todayCloseDate) {
        return {
          now,
          isCurrentlyWithinOpenHours: true,
          nextOpenDayOffset: 0,
          nextOpeningDate: todayOpenDate,
          serviceCloseDate: todayCloseDate,
          targetDaySchedule: todaySchedule,
          nextOpeningDaySchedule: todaySchedule,
          dayPrefixLabel: "Today"
        };
      }

      // Case 2: Today is an open day and it is currently BEFORE today's opening time
      if (todaySchedule.isOpen && now < todayOpenDate) {
        return {
          now,
          isCurrentlyWithinOpenHours: false,
          nextOpenDayOffset: 0,
          nextOpeningDate: todayOpenDate,
          serviceCloseDate: todayCloseDate,
          targetDaySchedule: todaySchedule,
          nextOpeningDaySchedule: todaySchedule,
          dayPrefixLabel: "Today"
        };
      }

      // Case 3: Past today's closing time or today is a closed day -> find next open day (offset 1..7)
      for (let offset = 1; offset <= 7; offset++) {
        const candDayIdx = (now.getDay() + offset) % 7;
        const candSchedule = hoursList.find(d => d.dayIndex === candDayIdx);
        if (candSchedule && candSchedule.isOpen) {
          const nextOpen = buildDateAtHHMM(now, offset, candSchedule.openTime || "12:00");
          const nextClose = buildDateAtHHMM(now, offset, candSchedule.closeTime || "20:00");
          return {
            now,
            isCurrentlyWithinOpenHours: false,
            nextOpenDayOffset: offset,
            nextOpeningDate: nextOpen,
            serviceCloseDate: nextClose,
            targetDaySchedule: candSchedule,
            nextOpeningDaySchedule: candSchedule,
            dayPrefixLabel: offset === 1 ? `Tomorrow (${candSchedule.shortLabel})` : candSchedule.shortLabel
          };
        }
      }

      // Fallback if all 7 days are toggled closed in settings
      const fallbackOpen = buildDateAtHHMM(now, 1, todaySchedule.openTime || "12:00");
      const fallbackClose = buildDateAtHHMM(now, 1, todaySchedule.closeTime || "20:00");
      return {
        now,
        isCurrentlyWithinOpenHours: false,
        nextOpenDayOffset: 1,
        nextOpeningDate: fallbackOpen,
        serviceCloseDate: fallbackClose,
        targetDaySchedule: todaySchedule,
        nextOpeningDaySchedule: todaySchedule,
        dayPrefixLabel: "Tomorrow"
      };
    }

    function calculateKitchenQuote(activeOrders, cartItems, kitchenConfig, storeSettings = DEFAULT_STORE_SETTINGS, nowMs = Date.now()) {
      const { maxOvenSlots, makeLineStaff, qualityBufferMins } = kitchenConfig;
      const win = resolveNextOpeningAndServiceWindow(storeSettings, nowMs);

      let queuedOvenSlotMinutes = 0;
      let queuedPrepMinutes = 0;
      let preOpenQueuedOvenSlotMinutes = 0;
      let preOpenQueuedPrepMinutes = 0;

      activeOrders.forEach(order => {
        if (order.status === "READY" || order.status === "PICKED_UP" || order.refunded) return;

        order.items.forEach(item => {
          const qty = item.quantity || 1;
          if (order.status === "QUEUED") {
            queuedPrepMinutes += item.prepTimeMins * qty;
            queuedOvenSlotMinutes += (item.ovenSlots * item.cookTimeMins) * qty;
            if (order.queuedForOpen) {
              preOpenQueuedPrepMinutes += item.prepTimeMins * qty;
              preOpenQueuedOvenSlotMinutes += (item.ovenSlots * item.cookTimeMins) * qty;
            }
          } else if (order.status === "MAKE_LINE") {
            queuedPrepMinutes += (item.prepTimeMins * 0.5) * qty;
            queuedOvenSlotMinutes += (item.ovenSlots * item.cookTimeMins) * qty;
          } else if (order.status === "IN_OVEN") {
            queuedOvenSlotMinutes += (item.ovenSlots * (item.cookTimeMins * 0.55)) * qty;
          }
        });
      });

      let cartPrepMins = 0;
      let maxSingleItemCookMins = 0;
      let cartOvenSlotsRequired = 0;
      let cartOvenSlotMinutes = 0;

      cartItems.forEach(item => {
        const qty = item.quantity || 1;
        cartPrepMins += item.prepTimeMins * qty;
        cartOvenSlotsRequired += item.ovenSlots * qty;
        cartOvenSlotMinutes += (item.ovenSlots * item.cookTimeMins) * qty;
        if (item.cookTimeMins > maxSingleItemCookMins) {
          maxSingleItemCookMins = item.cookTimeMins;
        }
      });

      if (cartItems.length === 0) {
        cartPrepMins = 3;
        maxSingleItemCookMins = 10;
        cartOvenSlotsRequired = 1.0;
        cartOvenSlotMinutes = 10;
      }

      const makeLineDelay = Math.ceil((queuedPrepMinutes + cartPrepMins) / Math.max(1, makeLineStaff));
      const ovenBacklogDelay = Math.floor(queuedOvenSlotMinutes / Math.max(1, maxOvenSlots));
      const ovenBatchesNeeded = Math.max(1, Math.ceil(cartOvenSlotsRequired / Math.max(1, maxOvenSlots)));
      const totalCookDuration = maxSingleItemCookMins * ovenBatchesNeeded;

      // Pure real-time kitchen queue + prep + bake duration
      const kitchenQueueAndBakeMins = makeLineDelay + ovenBacklogDelay + totalCookDuration + qualityBufferMins;

      let readyTimestamp;
      if (win.isCurrentlyWithinOpenHours) {
        // Store is currently OPEN within operating hours: next available time is based on current queue & real-time data
        readyTimestamp = new Date(win.now.getTime() + kitchenQueueAndBakeMins * 60000);
      } else {
        // Store is before opening time (or after close): pickup ready time is NO EARLIER than the next opening time,
        // plus any pre-open orders already queued for opening (and if we are minutes away from open, never earlier than now + kitchenQueueAndBakeMins)
        const preOpenQueueDelayMins =
          Math.ceil(preOpenQueuedPrepMinutes / Math.max(1, makeLineStaff)) +
          Math.floor(preOpenQueuedOvenSlotMinutes / Math.max(1, maxOvenSlots)) +
          (cartItems.length > 0 ? (ovenBatchesNeeded - 1) * maxSingleItemCookMins : 0);

        const openingFloorMs = win.nextOpeningDate.getTime() + preOpenQueueDelayMins * 60000;
        const liveFromNowMs = win.now.getTime() + kitchenQueueAndBakeMins * 60000;
        readyTimestamp = new Date(Math.max(openingFloorMs, liveFromNowMs));
      }

      const timeFormatted12 = readyTimestamp.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
      const readyTimeFormatted =
        win.dayPrefixLabel === "Today"
          ? timeFormatted12
          : `${win.targetDaySchedule.shortLabel} ${timeFormatted12}`;

      const minsUntilReady = Math.max(
        kitchenQueueAndBakeMins,
        Math.round((readyTimestamp.getTime() - win.now.getTime()) / 60000)
      );

      return {
        totalEstimatedMins: kitchenQueueAndBakeMins,
        minsUntilReady,
        readyTimestamp,
        readyTimeFormatted,
        isCurrentlyWithinOpenHours: win.isCurrentlyWithinOpenHours,
        nextOpenDayOffset: win.nextOpenDayOffset,
        nextOpeningDaySchedule: win.nextOpeningDaySchedule,
        nextOpeningDate: win.nextOpeningDate,
        serviceCloseDate: win.serviceCloseDate,
        dayPrefixLabel: win.dayPrefixLabel,
        nextOpeningFormatted: `${win.dayPrefixLabel} at ${formatTime24To12(win.targetDaySchedule.openTime)}`,
        breakdown: {
          makeLineDelay,
          ovenBacklogDelay,
          totalCookDuration,
          qualityBufferMins,
          queuedOvenSlotsLoad: Math.min(100, Math.round((queuedOvenSlotMinutes / (maxOvenSlots * 15)) * 100))
        }
      };
    }

    function getInitialSeedPromisedTime(offsetMinsAfterEarliest) {
      const win = resolveNextOpeningAndServiceWindow(DEFAULT_STORE_SETTINGS, Date.now());
      const baseMs = Math.max(Date.now(), win.nextOpeningDate.getTime());
      return new Date(baseMs + offsetMinsAfterEarliest * 60000).toLocaleTimeString([], {
        hour: "numeric",
        minute: "2-digit"
      });
    }

      // ==========================================================================
      // REAL-TIME CROSS-TAB & CROSS-DEVICE SYNC ENGINE + KITCHEN TICKET CHIME
      // ==========================================================================
      const playKitchenTicketChime = () => {
        if (!kdsChimeEnabledRef.current) return;
        try {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return;
          const ctx = new AudioCtx();
          // Two-tone restaurant kitchen bell ("Ding-Dong!")
          const playTone = (freq, startTime, duration) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = "triangle";
            osc.frequency.setValueAtTime(freq, startTime);
            gain.gain.setValueAtTime(0.22, startTime);
            gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(startTime);
            osc.stop(startTime + duration);
          };
          const now = ctx.currentTime;
          playTone(880, now, 0.32);        // A5
          playTone(1174.66, now + 0.14, 0.45); // D6
        } catch (e) {}
      };

      const applyIncomingSyncPayload = (payload) => {

          };
        }

        const handleStorageEvent = (ev) => {
          if (ev.key === SHARED_STORAGE_KEY && ev.newValue) {
            try {
              const parsed = JSON.parse(ev.newValue);
              applyIncomingSyncPayload(parsed);
            } catch (e) {}
          }
        };
        window.addEventListener("storage", handleStorageEvent);

        // Optional Server-Sent Events stream when running with node server.js (syncs across separate phones & iPads)
        let es = null;
        try {
          es = new EventSource("/api/stream");
          es.onmessage = (ev) => {
            try {
              const parsed = JSON.parse(ev.data);
              applyIncomingSyncPayload(parsed);
            } catch (e) {}
          };
          es.onerror = () => {
            // Static hosting (GitHub Pages / python http.server) — close SSE quietly and rely on BroadcastChannel + localStorage
            if (es) es.close();
          };

        return () => {
          if (bc) bc.close();
          window.removeEventListener("storage", handleStorageEvent);

      useEffect(() => {

      // MASTER OPENED / CLOSED & STORE OPERATING HOURS ENGINE

      const storeStatusInfo = useMemo(() => {
        const now = new Date(clockTick);
        const jsDay = now.getDay(); // 0 = Sun, 1 = Mon, ..., 6 = Sat
        const hoursList = storeSettings?.weeklyHours || DEFAULT_STORE_SETTINGS.weeklyHours;
        const todaySchedule = hoursList.find(d => d.dayIndex === jsDay) || hoursList[0];

        const parseMins = (hhmm) => {
          if (!hhmm || !hhmm.includes(":")) return 0;
          const [h, m] = hhmm.split(":").map(x => parseInt(x, 10) || 0);
          return h * 60 + m;
        };

        const nowMins = now.getHours() * 60 + now.getMinutes();
        const openMins = parseMins(todaySchedule.openTime);
        const closeMins = parseMins(todaySchedule.closeTime);
        const isAutoOpenNow = Boolean(todaySchedule.isOpen && nowMins >= openMins && nowMins < closeMins);

        const mode = storeSettings?.masterMode || "OPEN";
        const isStoreOpen = mode === "OPEN" ? true : mode === "CLOSED" ? false : isAutoOpenNow;

        // Build 15-min scheduled pickup slots starting NO EARLIER than liveQuote.readyTimestamp
        // (which is >= nextOpeningDate before open, and = now + liveQueueMins once open)
        const earliestReadyMs = liveQuote.readyTimestamp.getTime();
        const nextOpenMs = liveQuote.nextOpeningDate.getTime();
        const firstSlotFloorMs = Math.max(earliestReadyMs, nextOpenMs);
        const fifteenMinMs = 15 * 60 * 1000;
        // Round up to next 15-min slot boundary (unless already on an exact 15-min mark such as 12:00 PM opening)
        const roundedStartMs =
          firstSlotFloorMs % fifteenMinMs === 0
            ? firstSlotFloorMs
            : Math.ceil(firstSlotFloorMs / fifteenMinMs) * fifteenMinMs;

        const closeBoundMs = Math.max(roundedStartMs + 30 * 60000, liveQuote.serviceCloseDate.getTime());
        const availableScheduleSlots = [];
        const dayPrefix = liveQuote.nextOpenDayOffset === 0 ? "" : `${liveQuote.nextOpeningDaySchedule.shortLabel} `;

        // Always include the exact earliest ready time as the first option if it precedes roundedStartMs
        if (firstSlotFloorMs < roundedStartMs) {
          const exactFirstStr = `${dayPrefix}${new Date(firstSlotFloorMs).toLocaleTimeString([], {
            hour: "numeric",
            minute: "2-digit"
          })}`;
          availableScheduleSlots.push(exactFirstStr);
        }

        for (let t = roundedStartMs; t <= closeBoundMs; t += fifteenMinMs) {
          const slotDate = new Date(t);
          const time12 = slotDate.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
          const label = `${dayPrefix}${time12}`;
          if (!availableScheduleSlots.includes(label)) {
            availableScheduleSlots.push(label);
          }
        }

        const todayHoursFormatted = todaySchedule.isOpen
          ? `${formatTime24To12(todaySchedule.openTime)} – ${formatTime24To12(todaySchedule.closeTime)}`
          : `Closed (${todaySchedule.note || "Day Off"})`;

          isAutoOpenNow,
          todaySchedule,
          todayHoursFormatted,
          availableScheduleSlots,
          canPlaceOnlineOrder,
          closedBannerMessage:
            storeSettings?.closedBannerMessage ||

        if (presetType === "COPY_TUE_TO_WEEK") {

            return {

                  : { ...d, isOpen: true, openTime: tue.openTime, closeTime: tue.closeTime }

        if (presetType === "OPEN_ALL_7_DAYS") {
          setStoreSettings(prev => {
            const base = prev || DEFAULT_STORE_SETTINGS;

              ...base,
              weeklyHours: (base.weeklyHours || []).map(d => ({ ...d, isOpen: true }))

        setIsSyncLauncherOpen(false);
      };

      const handleStaffPinSubmit = (e, targetViewAfterUnlock = "KDS") => {
        if (e && e.preventDefault) e.preventDefault();
        if (pinInput.trim() === staffPinCode) {
          setIsCustomerLocked(false);
          setIsPinModalOpen(false);
          setPinInput("");
          setPinError("");
          setActiveView(targetViewAfterUnlock);
        } else {
          setPinError("Invalid Staff PIN. (Demo PIN is 1914)");
        }
      };

      const openModeInNewWindow = (modeParam) => {
        const baseUrl = window.location.origin + window.location.pathname;
        window.open(`${baseUrl}?mode=${modeParam}`, "_blank", "noopener,noreferrer");
      };

      const resetDemoStateAllScreens = () => {
        setOrders(INITIAL_ORDERS);
        setInventory(INITIAL_INVENTORY);
        setMenuItems(BUCKYS_MENU);
        setKitchenConfig({
          maxOvenSlots: 8,
          makeLineStaff: 2,
          qualityBufferMins: 3
        });
        setStoreSettings(DEFAULT_STORE_SETTINGS);
        setIsSyncLauncherOpen(false);
      };

      // ==========================================================================
      // INVENTORY TELEMETRY & AVAILABILITY ENGINE
      // ==========================================================================
      // 1. How many units of each inventory item are currently committed in active KDS tickets (QUEUED or MAKE_LINE)
      const activeTicketInventoryUsage = useMemo(() => {
        const usage = {};
        orders.forEach(order => {
          if (order.status === "QUEUED" || order.status === "MAKE_LINE" || order.status === "IN_OVEN") {
            order.items.forEach(item => {
              const map = item.inventoryUsage || {};
              Object.entries(map).forEach(([invId, reqQty]) => {
                usage[invId] = (usage[invId] || 0) + reqQty * (item.quantity || 1);
              });
            });
          }
        });
        return usage;
      }, [orders]);

      // 2. How many units of each inventory item are currently held in the user's shopping bag
      const cartInventoryUsage = useMemo(() => {
        const usage = {};
        cart.forEach(item => {
          const map = item.inventoryUsage || {};
          Object.entries(map).forEach(([invId, reqQty]) => {
            usage[invId] = (usage[invId] || 0) + reqQty * (item.quantity || 1);
          });
        });
        return usage;
      }, [cart]);

      // 3. Determine availability & max remaining count for any menu item
      const getMenuItemAvailability = (menuItem) => {
        const map = menuItem.inventoryUsage || {};
        const entries = Object.entries(map);
        if (entries.length === 0) {
          return { available: true, maxCanAdd: 99, totalRemaining: 99, limitingReason: null };
        }

        let maxCanAdd = 999;
        let totalRemaining = 999;
        let limitingReason = null;

        for (const [invId, reqQty] of entries) {
          const invItem = inventory.find(i => i.id === invId);
          if (!invItem) continue;

          if (invItem.eightySixed || invItem.stock <= 0) {
            return {
              available: false,
              maxCanAdd: 0,
              totalRemaining: 0,
              limitingReason: `86'd: ${invItem.shortName}`
            };
          }

          const inCart = cartInventoryUsage[invId] || 0;
          const remainingAfterCart = Math.max(0, invItem.stock - inCart);
          const canAddForThisInv = Math.floor(remainingAfterCart / reqQty);
          const totalPossibleForThisInv = Math.floor(invItem.stock / reqQty);

          if (totalPossibleForThisInv < totalRemaining) {
            totalRemaining = totalPossibleForThisInv;
            limitingReason = invItem.shortName;
          }
          if (canAddForThisInv < maxCanAdd) {
            maxCanAdd = canAddForThisInv;
          }
        }

        return {
          available: totalRemaining > 0,
          maxCanAdd,
          totalRemaining,
          limitingReason
        };
      };

      // 4. Inventory adjustment helpers for KDS Staff
      const adjustInventoryStock = (invId, delta) => {
        setInventory(prev =>
          prev.map(item => {
            if (item.id !== invId) return item;
            const nextStock = Math.max(0, item.stock + delta);
            return {
              ...item,
              stock: nextStock,
              eightySixed: nextStock === 0 ? true : item.eightySixed && delta <= 0
            };
          })
        );
      };

      const toggleEightySix = (invId) => {
        setInventory(prev =>
          prev.map(item => {
            if (item.id !== invId) return item;
            const next86 = !item.eightySixed;
            return {
              ...item,
              eightySixed: next86,
              stock: !next86 && item.stock === 0 ? item.traySize : item.stock
            };
          })
        );
      };

      const resetAllInventoryToPar = () => {
        setInventory(prev =>
          prev.map(item => ({
            ...item,
            stock: item.dailyPar,
            eightySixed: false
          }))
        );
      };

      // Direct inline setter for any field on an inventory item (stock, dailyPar, lowThreshold, traySize)
      const setInventoryItemField = (invId, field, rawValue) => {
        const parsed = Math.max(0, parseInt(rawValue, 10) || 0);
        setInventory(prev =>
          prev.map(item => {
            if (item.id !== invId) return item;
            if (field === "stock") {
              return {
                ...item,
                stock: parsed,
                eightySixed: parsed === 0
              };
            }
            return {
              ...item,
              [field]: Math.max(1, parsed)
            };
          })
        );
      };

      // Open Bulk "Set All Inventory Counts" Modal
      const openBulkInventoryModal = () => {
        setDraftInventory(inventory.map(item => ({ ...item })));
        setIsBulkInventoryOpen(true);
      };

      // Update a row inside the Bulk Inventory Modal draft
      const updateDraftInventoryField = (invId, field, rawValue) => {
        setDraftInventory(prev =>
          prev.map(item => {
            if (item.id !== invId) return item;
            if (field === "eightySixed") {
              const next86 = Boolean(rawValue);
              return {
                ...item,
                eightySixed: next86,
                stock: next86 ? 0 : (item.stock === 0 ? item.dailyPar : item.stock)
              };
            }
            const parsed = Math.max(0, parseInt(rawValue, 10) || 0);
            if (field === "stock") {
              return {
                ...item,
                stock: parsed,
                eightySixed: parsed === 0
              };
            }
            return {
              ...item,
              [field]: Math.max(1, parsed)
            };
          })
        );
      };

      // Apply preset to all draft items inside the Bulk Modal
      const applyDraftPreset = (mode, targetCategory = "ALL") => {
        const customNum = Math.max(0, parseInt(bulkFillValue, 10) || 0);
        setDraftInventory(prev =>
          prev.map(item => {
            if (targetCategory !== "ALL" && item.category !== targetCategory) return item;
            if (mode === "FULL_PAR") {
              return { ...item, stock: item.dailyPar, eightySixed: false };
            }
            if (mode === "HALF_PAR") {
              const half = Math.max(1, Math.round(item.dailyPar * 0.5));
              return { ...item, stock: half, eightySixed: false };
            }
            if (mode === "ZERO_ALL") {
              return { ...item, stock: 0, eightySixed: true };
            }
            if (mode === "CUSTOM_VALUE") {
              return { ...item, stock: customNum, eightySixed: customNum === 0 };
            }
            return item;
          })
        );
      };

      // Add a new custom inventory item (from either the dedicated Add Custom Modal or Bulk Modal)
      const handleAddCustomInventoryItem = (e) => {
        if (e && e.preventDefault) e.preventDefault();
        if (!newCustomInvName.trim()) return;

        const customId = `custom-${Date.now()}`;
        const stockNum = Math.max(0, parseInt(newCustomInvStock, 10) || 0);
        const parNum = Math.max(1, parseInt(newCustomInvPar, 10) || 20);
        const lowNum = Math.max(1, parseInt(newCustomInvLow, 10) || Math.max(2, Math.round(parNum * 0.2)));
        const trayNum = Math.max(1, parseInt(newCustomInvTray, 10) || 6);
        const priceNum = Math.max(0, parseFloat(newCustomInvPrice) || 0);
        const prepNum = Math.max(0, parseInt(newCustomInvPrepMins, 10) || 0);
        const cookNum = Math.max(0, parseInt(newCustomInvCookMins, 10) || 0);
        const slotsNum = Math.max(0, parseFloat(newCustomInvOvenSlots) || 0);

        const isKitchenOnlyCat = newCustomInvCategory === "DOUGH" || newCustomInvCategory === "PREP";
        const shouldPublishToMenu = !isKitchenOnlyCat && newCustomInvAddToMenu;

        const newItem = {
          id: customId,
          name: newCustomInvName.trim(),
          shortName: newCustomInvName.trim(),
          category: newCustomInvCategory,
          isMenuItem: shouldPublishToMenu,
          isCustom: true,
          price: shouldPublishToMenu ? priceNum : undefined,
          stock: stockNum,
          dailyPar: parNum,
          lowThreshold: lowNum,
          unit: newCustomInvUnit.trim() || (shouldPublishToMenu ? "orders" : "portions"),
          traySize: trayNum,
          eightySixed: stockNum === 0,
          notes: newCustomInvNotes.trim() || (shouldPublishToMenu
            ? `Custom ${newCustomInvCategory} item • $${priceNum.toFixed(2)}`
            : "Custom kitchen inventory item")
        };

        // Add to live inventory (and draftInventory if bulk modal is open)
        setInventory(prev => [newItem, ...prev]);
        if (isBulkInventoryOpen) {
          setDraftInventory(prev => [newItem, ...prev]);
        }

        // If publishing to the Online Storefront & Counter POS Menu, add to menuItems too!
        if (shouldPublishToMenu) {
          const usageMap = { [customId]: 1 };
          if (newCustomInvDoughId && newCustomInvDoughId !== "NONE") {
            usageMap[newCustomInvDoughId] = 1;
          }
          const newMenuEntry = {
            id: customId,
            name: newCustomInvName.trim(),
            category: newCustomInvCategory,
            price: priceNum,
            badge: "Custom Special",
            description: newCustomInvNotes.trim() || "Custom house special freshly prepared in our Chatham kitchen.",
            prepTimeMins: prepNum,
            cookTimeMins: cookNum,
            ovenSlots: slotsNum,
            station: cookNum > 0 ? "PIZZA" : "COLD",
            isCustom: true,
            inventoryUsage: usageMap
          };
          setMenuItems(prev => [newMenuEntry, ...prev]);
        }

        setNewCustomInvName("");
        setNewCustomInvNotes("");
        setIsAddCustomModalOpen(false);
      };

      // Delete a custom inventory/menu item
      const deleteCustomInventoryItem = (invId) => {
        setInventory(prev => prev.filter(i => i.id !== invId));
        setDraftInventory(prev => prev.filter(i => i.id !== invId));
        setMenuItems(prev => prev.filter(i => i.id !== invId));
        setCart(prev => prev.filter(i => i.id !== invId));
      };

      // Save all changes from Bulk Modal to live KDS Inventory
      const saveBulkInventoryChanges = () => {
        setInventory(draftInventory);
        setIsBulkInventoryOpen(false);
      };

      // ========================================================================
      // TOTAL KITCHEN OVEN SLOTS & PER-ITEM OVEN SLOTS / COOK TIME ENGINE
      // ========================================================================
      const setTotalOvenSlots = (rawValue) => {
        const parsed = parseFloat(rawValue);
        if (Number.isNaN(parsed)) return;
        const clamped = Math.max(0.5, Math.min(64, Math.round(parsed * 100) / 100));
        setKitchenConfig(prev => ({ ...prev, maxOvenSlots: clamped }));
      };

      const adjustTotalOvenSlots = (delta) => {
        setKitchenConfig(prev => {
          const next = Math.max(0.5, Math.min(64, Math.round((Number(prev.maxOvenSlots || 8) + delta) * 100) / 100));
          return { ...prev, maxOvenSlots: next };
        });
      };

      const updateItemOvenAndTiming = (itemId, field, rawValue) => {
        const computeNextItem = (item) => {
          if (item.id !== itemId) return item;
          if (field === "station") {
            return { ...item, station: rawValue };
          }
          if (field === "ovenSlots") {
            const parsedSlots = Math.max(0, Math.min(16, Math.round((parseFloat(rawValue) || 0) * 100) / 100));
            return {
              ...item,
              ovenSlots: parsedSlots,
              station: parsedSlots > 0 && item.station === "COLD" ? "PIZZA" : item.station
            };
          }
          if (field === "cookTimeMins") {
            const parsedCook = Math.max(0, Math.min(90, parseInt(rawValue, 10) || 0));
            return {
              ...item,
              cookTimeMins: parsedCook,
              station: parsedCook === 0 && item.ovenSlots === 0 ? "COLD" : item.station
            };
          }
          if (field === "prepTimeMins") {
            const parsedPrep = Math.max(0, Math.min(60, parseInt(rawValue, 10) || 0));
            return { ...item, prepTimeMins: parsedPrep };
          }
          return item;
        };

        // 1. Update live menuItems (Storefront, POS & KDS)
        setMenuItems(prev => prev.map(computeNextItem));

        // 2. Sync any matching items in Customer/POS Shopping Bag
        setCart(prev => prev.map(computeNextItem));

        // 3. Sync any matching items in Active KDS Orders so oven slot math & wait quotes update immediately
        setOrders(prev =>
          prev.map(order => ({
            ...order,
            items: order.items.map(computeNextItem)
          }))
        );
      };

      // Stepper helper for +/- buttons on ovenSlots, cookTimeMins, prepTimeMins
      const adjustItemOvenAndTimingDelta = (itemId, field, delta) => {
        const target = menuItems.find(m => m.id === itemId);
        if (!target) return;
        const currentVal = Number(target[field] || 0);
        const nextVal = field === "ovenSlots"
          ? Math.max(0, Math.round((currentVal + delta) * 100) / 100)
          : Math.max(0, Math.round(currentVal + delta));
        updateItemOvenAndTiming(itemId, field, nextVal);
      };

      // Batch apply oven slots, cook time, or prep time across a category or all oven items
      const applyBatchOvenTiming = (mode, targetCategory = "ALL") => {
        const matchesFilter = (item) => {
          if (targetCategory === "ALL") return true;
          if (targetCategory === "OVEN_ONLY") return item.ovenSlots > 0 || item.cookTimeMins > 0 || item.station === "PIZZA" || item.station === "HOT_PREP";
          return item.category === targetCategory;
        };

        const transformItem = (item) => {
          if (!matchesFilter(item)) return item;
          if (mode === "SET_SLOTS") {
            const slots = Math.max(0, Math.min(16, Math.round((parseFloat(batchOvenSlotsVal) || 0) * 100) / 100));
            return { ...item, ovenSlots: slots };
          }
          if (mode === "SET_COOK") {
            const cook = Math.max(0, Math.min(90, parseInt(batchCookMinsVal, 10) || 0));
            return { ...item, cookTimeMins: cook };
          }
          if (mode === "SET_PREP") {
            const prep = Math.max(0, Math.min(60, parseInt(batchPrepMinsVal, 10) || 0));
            return { ...item, prepTimeMins: prep };
          }
          if (mode === "COOK_PLUS_2") {
            if (item.cookTimeMins <= 0 && item.ovenSlots <= 0) return item;
            return { ...item, cookTimeMins: Math.min(90, item.cookTimeMins + 2) };
          }
          if (mode === "COOK_MINUS_2") {
            if (item.cookTimeMins <= 0 && item.ovenSlots <= 0) return item;
            return { ...item, cookTimeMins: Math.max(1, item.cookTimeMins - 2) };
          }
          return item;
        };

        setMenuItems(prev => prev.map(transformItem));
        setCart(prev => prev.map(transformItem));
        setOrders(prev =>
          prev.map(order => ({
            ...order,
            items: order.items.map(transformItem)
          }))
        );
      };

      // Reset all built-in menu items back to factory default oven slots & cook times
      const resetAllOvenTimingToDefaults = () => {
        const defaultsMap = {};
        BUCKYS_MENU.forEach(item => {
          defaultsMap[item.id] = {
            prepTimeMins: item.prepTimeMins,
            cookTimeMins: item.cookTimeMins,
            ovenSlots: item.ovenSlots,
            station: item.station
          };
        });

        const restoreDefaults = (item) => {
          const def = defaultsMap[item.id];
          if (!def) return item;
          return { ...item, ...def };
        };

        setMenuItems(prev => prev.map(restoreDefaults));
        setCart(prev => prev.map(restoreDefaults));
        setOrders(prev =>
          prev.map(order => ({
            ...order,
            items: order.items.map(restoreDefaults)
          }))
        );
      };

      // ======================================================================
      // MENU EDITOR HELPERS (FULL EDITING OF NAME, PRICE, DESC, CATEGORY, ETC.)
      // ======================================================================
      const updateMenuItemField = (itemId, field, rawValue) => {
        const computeUpdated = (item) => {
          if (item.id !== itemId) return item;
          if (field === "price") {
            const parsedPrice = Math.max(0, Math.round((parseFloat(rawValue) || 0) * 100) / 100);
            const delta = parsedPrice - (item.basePrice !== undefined ? item.basePrice : item.price);
            return {
              ...item,
              basePrice: parsedPrice,
              price: Math.max(0, Number((item.price + delta).toFixed(2)))
            };
          }
          if (field === "name") {
            return { ...item, name: rawValue };
          }
          if (field === "description") {
            return { ...item, description: rawValue };
          }
          if (field === "category") {
            return { ...item, category: rawValue };
          }
          if (field === "badge") {
            return { ...item, badge: rawValue };
          }
          return item;
        };

        setMenuItems(prev => prev.map(computeUpdated));
        setCart(prev => prev.map(computeUpdated));

        // Keep linked KDS inventory name/category/price synced if changed
        if (field === "name" || field === "category" || field === "price") {
          setInventory(prev =>
            prev.map(inv => {
              if (inv.id !== itemId) return inv;
              if (field === "price") {
                const parsedPrice = Math.max(0, Math.round((parseFloat(rawValue) || 0) * 100) / 100);
                return { ...inv, price: parsedPrice, notes: `${inv.category} • $${parsedPrice.toFixed(2)}` };
              }
              if (field === "name") {
                return { ...inv, name: rawValue, shortName: rawValue.slice(0, 18) };
              }
              if (field === "category") {
                return { ...inv, category: rawValue };
              }
              return inv;
            })
          );
        }
      };

      const adjustMenuItemPriceDelta = (itemId, delta) => {
        const target = menuItems.find(m => m.id === itemId);
        if (!target) return;
        const nextPrice = Math.max(0.5, Math.round((Number(target.price || 0) + delta) * 100) / 100);
        updateMenuItemField(itemId, "price", nextPrice);
      };

      const moveMenuItemOrder = (itemId, direction) => {
        setMenuItems(prev => {
          const idx = prev.findIndex(m => m.id === itemId);
          if (idx === -1) return prev;
          const targetIdx = direction === "UP" ? idx - 1 : idx + 1;
          if (targetIdx < 0 || targetIdx >= prev.length) return prev;
          const copy = [...prev];
          const [moved] = copy.splice(idx, 1);
          copy.splice(targetIdx, 0, moved);
          return copy;
        });
      };

      const duplicateMenuItem = (item) => {
        const newId = `custom-menu-${Date.now().toString().slice(-5)}`;
        const clonedMenu = {
          ...item,
          id: newId,
          name: `${item.name} (Copy)`,
          inventoryUsage: { ...(item.inventoryUsage || {}), [newId]: 1 }
        };
        const linkedInv = inventory.find(i => i.id === item.id);
        const clonedInv = {
          id: newId,
          name: clonedMenu.name,
          shortName: clonedMenu.name.slice(0, 18),
          category: clonedMenu.category,
          isMenuItem: true,
          stock: linkedInv ? linkedInv.stock : 15,
          dailyPar: linkedInv ? linkedInv.dailyPar : 25,
          lowThreshold: linkedInv ? linkedInv.lowThreshold : 5,
          unit: linkedInv ? linkedInv.unit : "items",
          traySize: linkedInv ? linkedInv.traySize : 6,
          eightySixed: false,
          notes: `${clonedMenu.category} • $${clonedMenu.price.toFixed(2)}`
        };
        setMenuItems(prev => {
          const idx = prev.findIndex(m => m.id === item.id);
          if (idx === -1) return [clonedMenu, ...prev];
          const copy = [...prev];
          copy.splice(idx + 1, 0, clonedMenu);
          return copy;
        });
        setInventory(prev => [clonedInv, ...prev]);
      };

      const deleteMenuItem = (itemId) => {
        setMenuItems(prev => prev.filter(m => m.id !== itemId));
        setCart(prev => prev.filter(c => c.id !== itemId));
        setInventory(prev => prev.filter(inv => inv.id !== itemId));
      };

      const resetEntireMenuToDefaults = () => {
        setMenuItems(BUCKYS_MENU);
        setInventory(INITIAL_INVENTORY);
        setCart([]);
      };

      // Quick summary counts for header & KDS banner
      const roundDoughStock = inventory.find(i => i.id === "dough-round-16")?.stock ?? 0;
      const detroitPanStock = inventory.find(i => i.id === "dough-detroit-8x10")?.stock ?? 0;
      const grandmaPanStock = inventory.find(i => i.id === "dough-grandma")?.stock ?? 0;
      const lowOr86Count = inventory.filter(i => i.eightySixed || i.stock <= i.lowThreshold).length;

      // Cart Helpers (Respects live KDS inventory stock & supports Toast Modifiers / Half-and-Half Toppings)
      const addToCart = (item) => {
        const avail = getMenuItemAvailability(item);
        if (!avail.available || avail.maxCanAdd <= 0) return;

        setCart(prev => {
          // Only merge into an existing cart line if it has no custom modifiers/notes
          const existingIdx = prev.findIndex(
            i => i.id === item.id && (!i.modifiers || i.modifiers.length === 0) && !i.specialNote
          );
          if (existingIdx !== -1) {
            return prev.map((i, idx) => (idx === existingIdx ? { ...i, quantity: i.quantity + 1 } : i));
          }
          return [
            ...prev,
            {
              ...item,
              cartLineId: `${item.id}-std-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
              quantity: 1,
              modifiers: [],
              specialNote: ""
            }
          ];
        });
      };

      const updateQuantity = (idOrLineId, delta) => {
        const targetCartItem = cart.find(i => (i.cartLineId || i.id) === idOrLineId || i.id === idOrLineId);
        if (!targetCartItem) return;
        if (delta > 0) {
          const menuItem = menuItems.find(i => i.id === targetCartItem.id);
          if (menuItem) {
            const avail = getMenuItemAvailability(menuItem);
            if (avail.maxCanAdd <= 0) return;
          }
        }
        setCart(prev =>
          prev
            .map(i =>
              (i.cartLineId || i.id) === idOrLineId ? { ...i, quantity: Math.max(0, i.quantity + delta) } : i
            )
            .filter(i => i.quantity > 0)
        );
      };

      // Open Toast-Style Pizza & Item Modifier Builder Modal
      const openItemCustomizer = (item) => {
        const avail = getMenuItemAvailability(item);
        if (!avail.available || avail.maxCanAdd <= 0) return;
        setCustomizingItem(item);
        setCustomToppingsMap({});
        setCustomPrepMods([]);
        setCustomDipSides([]);
        setCustomItemNote("");
        setCustomItemQty(1);
      };

      const toggleCustomToppingPlacement = (topId, placement) => {
        setCustomToppingsMap(prev => {
          const next = { ...prev };
          if (next[topId] === placement) {
            delete next[topId];
          } else {
            next[topId] = placement; // "WHOLE" | "LEFT" | "RIGHT"
          }
          return next;
        });
      };

      const toggleCustomPrepMod = (modId) => {
        setCustomPrepMods(prev =>
          prev.includes(modId) ? prev.filter(x => x !== modId) : [...prev, modId]
        );
      };

      const toggleCustomDipSide = (sideId) => {
        setCustomDipSides(prev =>
          prev.includes(sideId) ? prev.filter(x => x !== sideId) : [...prev, sideId]
        );
      };

      const customModalModifiersPreview = useMemo(() => {
        if (!customizingItem) return { modsList: [], modUpcharge: 0 };
        const modsList = [];
        let modUpcharge = 0;

        Object.entries(customToppingsMap).forEach(([topId, placement]) => {
          const topObj = TOAST_PIZZA_TOPPINGS.find(t => t.id === topId);
          if (!topObj) return;
          // Half-pie toppings cost 60% of whole-pie topping price (Toast pizza pricing convention)
          const effPrice = placement === "WHOLE" ? topObj.price : Number((topObj.price * 0.6).toFixed(2));
          const prefix =
            placement === "LEFT" ? "◐ Left Half:" : placement === "RIGHT" ? "◑ Right Half:" : "● Whole:";
          modsList.push({
            id: `${topId}-${placement}`,
            label: `${prefix} ${topObj.name}`,
            price: effPrice
          });
          modUpcharge += effPrice;
        });

        customPrepMods.forEach(modId => {
          const m = TOAST_PREP_MODIFIERS.find(p => p.id === modId);
          if (m) {
            modsList.push({ id: modId, label: m.name, price: 0 });
          }
        });

        customDipSides.forEach(sideId => {
          const s = TOAST_DIP_SIDES.find(d => d.id === sideId);
          if (s) {
            modsList.push({ id: sideId, label: s.name, price: s.price });
            modUpcharge += s.price;
          }
        });

        return { modsList, modUpcharge: Number(modUpcharge.toFixed(2)) };
      }, [customizingItem, customToppingsMap, customPrepMods, customDipSides]);

      const confirmAddCustomizedItem = (e) => {
        if (e && e.preventDefault) e.preventDefault();
        if (!customizingItem) return;
        const avail = getMenuItemAvailability(customizingItem);
        const safeQty = Math.max(1, Math.min(avail.maxCanAdd || 1, customItemQty));
        const unitPrice = Number((customizingItem.price + customModalModifiersPreview.modUpcharge).toFixed(2));

        const customizedCartLine = {
          ...customizingItem,
          cartLineId: `${customizingItem.id}-cust-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
          basePrice: customizingItem.price,
          price: unitPrice,
          quantity: safeQty,
          modifiers: customModalModifiersPreview.modsList,
          specialNote: customItemNote.trim()
        };

        setCart(prev => [...prev, customizedCartLine]);
        setCustomizingItem(null);
      };

      // Promo Code, POS Staff Comp & Loyalty Rewards Helpers
      const applyPromoCodeInput = () => {
        const clean = promoCodeInput.trim().toUpperCase();
        if (!clean) return;
        const match = PROMO_CODES_BOOK[clean];
        if (!match) {
          setPromoFeedback("Invalid promo code. Try BUCKYS10, CHATHAM5, or PIZZABOWL.");
          return;
        }
        setAppliedDiscount({ label: match.label, type: match.type, value: match.value });
        setPromoFeedback(`✓ Applied: ${match.label}`);
        setPromoCodeInput("");
      };

      const applyPosQuickDiscount = (label, percentVal) => {
        if (appliedDiscount && appliedDiscount.label === label) {
          setAppliedDiscount(null);
          setPromoFeedback("");
          return;
        }
        setAppliedDiscount({ label, type: "PERCENT", value: percentVal });
        setPromoFeedback(`✓ Applied POS Discount: ${label}`);
      };

      const lookupLoyaltyAccount = () => {
        const digits = (loyaltyPhoneInput || customerPhone || "").replace(/\D/g, "");
        if (digits.length < 7) {
          setLoyaltyMember({
            name: customerName.trim() || "Chatham VIP Guest",
            phone: "(973) 555-0148",
            points: 145
          });
          setLoyaltyPhoneInput("(973) 555-0148");
          if (!customerPhone) setCustomerPhone("(973) 555-0148");
          return;
        }
        setLoyaltyMember({
          name: customerName.trim() || "Bucky's Dough Club Member",
          phone: loyaltyPhoneInput || customerPhone,
          points: 145
        });
      };

      const cartSubtotal = cart.reduce((sum, item) => sum + item.price * item.quantity, 0);

      const discountDollarAmount = useMemo(() => {
        if (cartSubtotal <= 0) return 0;
        let disc = 0;
        if (appliedDiscount) {
          if (appliedDiscount.type === "PERCENT") {
            disc += cartSubtotal * (appliedDiscount.value / 100);
          } else {
            disc += appliedDiscount.value;
          }
        }
        if (redeemLoyaltyReward && loyaltyMember && loyaltyMember.points >= 100) {
          disc += 10.0;
        }
        return Number(Math.min(cartSubtotal, disc).toFixed(2));
      }, [cartSubtotal, appliedDiscount, redeemLoyaltyReward, loyaltyMember]);

      const discountedSubtotal = Math.max(0, Number((cartSubtotal - discountDollarAmount).toFixed(2)));
      const njSalesTax = discountedSubtotal * 0.06625; // NJ 6.625% Sales Tax on post-discount subtotal
      const tipAmount = useMemo(() => {
        if (cart.length === 0) return 0;
        if (tipSelection === "15") return discountedSubtotal * 0.15;
        if (tipSelection === "18") return discountedSubtotal * 0.18;
        if (tipSelection === "20") return discountedSubtotal * 0.20;
        if (tipSelection === "CUSTOM") {
          const parsed = parseFloat(customTipInput);
          return !Number.isNaN(parsed) && parsed >= 0 ? parsed : 0;
        }
        return 0;
      }, [cart.length, discountedSubtotal, tipSelection, customTipInput]);
      const tipLabelText =
        tipSelection === "15"
          ? "15%"
          : tipSelection === "18"
          ? "18%"
          : tipSelection === "20"
          ? "20%"
          : tipSelection === "CUSTOM"
          ? "Custom"
          : "No Tip";
      const cartTotal = discountedSubtotal + njSalesTax + tipAmount;

      // ========================================================================
      // OPTION 1: EMBEDDED STRIPE PAYMENT ELEMENT & PAYMENTINTENT ENGINE
      // ========================================================================
      // 1. Auto-detect server-configured Stripe Publishable Key from /api/stripe-config if running with server.js
      useEffect(() => {
        fetch("/api/stripe-config")
          .then(res => (res.ok ? res.json() : null))
          .then(data => {
            if (data && data.publishableKey && data.publishableKey.startsWith("pk_")) {
              setStripePublishableKey(prev => prev || data.publishableKey);
              setDraftStripePk(prev => prev || data.publishableKey);
            }
          })
          .catch(() => {
            // Static hosting (e.g., GitHub Pages) — uses localStorage key or interactive Stripe Sandbox
          });
      }, []);

      // 2. When Checkout Modal opens, initialize Stripe PaymentIntent & mount Stripe Element if pk_ key is active
      useEffect(() => {
        if (!isCheckoutOpen) {
          setStripeError("");
          setStripeProcessing(false);
          if (stripeMountedElementRef.current) {
            try {
              stripeMountedElementRef.current.destroy();
            } catch (e) {}
            stripeMountedElementRef.current = null;
          }
          return;
        }

        const cleanPk = stripePublishableKey.trim();
        if (!cleanPk.startsWith("pk_") || typeof window.Stripe !== "function") {
          setStripeMountStatus("SANDBOX");
          return;
        }

        let cancelled = false;
        setStripeMountStatus("LOADING");
        setStripeError("");

        const initStripeElement = async () => {
          try {
            const stripe = window.Stripe(cleanPk);
            stripeInstanceRef.current = stripe;

            // Step A: Attempt to create a PaymentIntent via backend endpoint (POST /api/create-payment-intent)
            let clientSecret = "";
            try {
              const resp = await fetch("/api/create-payment-intent", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                  cart: cart.map(i => ({ id: i.id, name: i.name, price: i.price, quantity: i.quantity })),
                  tipAmount: Number(tipAmount.toFixed(2)),
                  customerName: customerName || "Online Guest",
                  customerPhone: customerPhone || "(973) 200-2388",
                  customerEmail: customerEmail || undefined,
                  promisedTime: pickupTimingMode === "SCHEDULED" ? scheduledSlot : liveQuote.readyTimeFormatted
                })
              });
              if (resp.ok) {
                const data = await resp.json();
                if (data && data.clientSecret) {
                  clientSecret = data.clientSecret;
                }
              }
            } catch (networkErr) {
              // No backend running (e.g. GitHub Pages static demo) — will mount real Stripe Card Element below
            }

            if (cancelled) return;

            const appearance = {
              theme: "stripe",
              variables: {
                colorPrimary: "#C8281E",
                colorBackground: "#FFFFFF",
                colorText: "#161413",
                colorDanger: "#C8281E",
                fontFamily: "'DM Sans', system-ui, sans-serif",
                borderRadius: "0px"
              }
            };

            if (clientSecret) {
              // Full Stripe Payment Element (Card + Apple Pay + Google Pay + Link) backed by PaymentIntent
              setStripeClientSecret(clientSecret);
              const elements = stripe.elements({ clientSecret, appearance });
              stripeElementsRef.current = elements;
              const paymentElement = elements.create("payment", { layout: "tabs" });
              setStripeMountStatus("PAYMENT_ELEMENT");
              setTimeout(() => {
                const container = document.getElementById("stripe-payment-element-mount");
                if (container && !cancelled) {
                  container.innerHTML = "";
                  paymentElement.mount("#stripe-payment-element-mount");
                  stripeMountedElementRef.current = paymentElement;
                }
              }, 50);
            } else {
              // Client-only Stripe.js Mode: Mount official Stripe Card Element (tokenizes via Stripe iframe)
              setStripeClientSecret("");
              const elements = stripe.elements({ appearance });
              stripeElementsRef.current = elements;
              const cardElement = elements.create("card", {
                hidePostalCode: false,
                style: {
                  base: {
                    color: "#161413",
                    fontFamily: "'DM Sans', system-ui, sans-serif",
                    fontSize: "14px",
                    "::placeholder": { color: "#78716c" }
                  },
                  invalid: { color: "#C8281E" }
                }
              });
              setStripeMountStatus("CARD_ELEMENT");
              setTimeout(() => {
                const container = document.getElementById("stripe-card-element-mount");
                if (container && !cancelled) {
                  container.innerHTML = "";
                  cardElement.mount("#stripe-card-element-mount");
                  stripeMountedElementRef.current = cardElement;
                }
              }, 50);
            }
          } catch (err) {
            if (!cancelled) {
              setStripeError(err.message || "Could not initialize Stripe.js — check your Publishable Key.");
              setStripeMountStatus("SANDBOX");
            }
          }
        };

        initStripeElement();
        return () => {
          cancelled = true;
        };
      }, [isCheckoutOpen, stripePublishableKey]);

      const saveStripeKeyConfig = (e) => {
        if (e && e.preventDefault) e.preventDefault();
        const trimmed = draftStripePk.trim();
        setStripePublishableKey(trimmed);
        try {
          if (trimmed) {
            localStorage.setItem("buckys_stripe_pk", trimmed);
          } else {
            localStorage.removeItem("buckys_stripe_pk");
          }
        } catch (err) {}
        setIsStripeSettingsOpen(false);
      };

      // Submit Order (Online or POS) -> Deducts Dough & Prep Inventory automatically!
      const handlePlaceOrder = (sourceType, paymentLabel, stripeTxId = null) => {
        if (cart.length === 0) return;

        // Deduct ordered quantities from live kitchen inventory
        setInventory(prev =>
          prev.map(invItem => {
            const usedQty = cartInventoryUsage[invItem.id] || 0;
            if (usedQty === 0) return invItem;
            const newStock = Math.max(0, invItem.stock - usedQty);
            return {
              ...invItem,
              stock: newStock,
              eightySixed: newStock === 0 ? true : invItem.eightySixed
            };
          })
        );

        const promised = pickupTimingMode === "SCHEDULED" && sourceType === "ONLINE"
          ? `${scheduledSlot} (Pre-Order)`
          : liveQuote.readyTimeFormatted;

        const generatedTxId = stripeTxId || `pi_3Q${Math.random().toString(36).substring(2, 10).toUpperCase()}`;

        const newOrder = {
          id: `ORD-${1044 + orders.length}`,
          customerName: customerName.trim() || (sourceType === "POS" ? "Walk-In Guest" : "Online Guest"),
          customerPhone: customerPhone.trim() || "(973) 200-2388",
          customerEmail: customerEmail.trim() || undefined,
          source: sourceType,
          diningOption: diningOption || "PICKUP",
          curbsideVehicle: diningOption === "CURBSIDE" ? curbsideVehicle.trim() : "",
          orderKitchenNote: orderKitchenNote.trim(),
          isRush: false,
          refunded: false,
          queuedForOpen: !liveQuote.isCurrentlyWithinOpenHours,
          status: "QUEUED",
          createdAt: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
          promisedTime: promised,
          estimatedMins: liveQuote.totalEstimatedMins,
          paid: true,
          paymentMethod: paymentLabel,
          stripePaymentIntentId: generatedTxId,
          subtotal: Number(discountedSubtotal.toFixed(2)),
          rawSubtotal: Number(cartSubtotal.toFixed(2)),
          discountAmount: Number(discountDollarAmount.toFixed(2)),
          discountLabel: appliedDiscount
            ? appliedDiscount.label
            : redeemLoyaltyReward
            ? "$10 Loyalty Reward"
            : "",
          taxAmount: Number(njSalesTax.toFixed(2)),
          tipAmount: Number(tipAmount.toFixed(2)),
          tipLabel: tipLabelText,
          totalAmount: Number(cartTotal.toFixed(2)),
          items: [...cart]
        };

        setOrders(prev => [newOrder, ...prev]);
        setCart([]);
        setCustomTipInput("");
        setAppliedDiscount(null);
        setRedeemLoyaltyReward(false);
        setPromoFeedback("");
        setOrderKitchenNote("");
        setCurbsideVehicle("");
        setCustomerName("");
        setCustomerPhone("");
        setIsCheckoutOpen(false);
        setStripeProcessing(false);
        setStripeError("");
        setOrderConfirmation(newOrder);
      };

      // Process Online Checkout via Option 1 (Stripe Payment Element / Card Element / Interactive Sandbox)
      const handleStripeCheckoutSubmit = async (e) => {
        if (e && e.preventDefault) e.preventDefault();
        if (cart.length === 0 || stripeProcessing) return;

        if (!customerName.trim()) {
          setStripeError("Please enter a pickup name for your order.");
          return;
        }
        if (!customerPhone.trim()) {
          setStripeError("Please enter a mobile phone number for your ready text alert.");
          return;
        }

        setStripeError("");
        setStripeProcessing(true);

        // Mode A: Full Stripe Payment Element backed by a server PaymentIntent
        if (stripeMountStatus === "PAYMENT_ELEMENT" && stripeInstanceRef.current && stripeElementsRef.current) {
          try {
            const { error, paymentIntent } = await stripeInstanceRef.current.confirmPayment({
              elements: stripeElementsRef.current,
              confirmParams: {
                receipt_email: customerEmail.trim() || undefined,
                payment_method_data: {
                  billing_details: {
                    name: customerName.trim(),
                    phone: customerPhone.trim()
                  }
                }
              },
              redirect: "if_required"
            });

            if (error) {
              setStripeError(error.message || "Payment failed. Please check your payment details.");
              setStripeProcessing(false);
              return;
            }

            if (paymentIntent && (paymentIntent.status === "succeeded" || paymentIntent.status === "processing")) {
              handlePlaceOrder("ONLINE", `Stripe Paid (${paymentIntent.id.slice(0, 12)}…)`, paymentIntent.id);
              return;
            }
          } catch (err) {
            setStripeError(err.message || "Error confirming Stripe PaymentIntent.");
            setStripeProcessing(false);
            return;
          }
        }

        // Mode B: Live Stripe.js Card Element (Client-side tokenization with pk_test_ / pk_live_)
        if (stripeMountStatus === "CARD_ELEMENT" && stripeInstanceRef.current && stripeMountedElementRef.current) {
          try {
            const { error, paymentMethod } = await stripeInstanceRef.current.createPaymentMethod({
              type: "card",
              card: stripeMountedElementRef.current,
              billing_details: {
                name: customerName.trim(),
                phone: customerPhone.trim(),
                email: customerEmail.trim() || undefined
              }
            });

            if (error) {
              setStripeError(error.message || "Your card could not be verified by Stripe.");
              setStripeProcessing(false);
              return;
            }

            const brand = paymentMethod?.card?.brand ? paymentMethod.card.brand.toUpperCase() : "CARD";
            const last4 = paymentMethod?.card?.last4 || "4242";
            handlePlaceOrder("ONLINE", `Stripe ${brand} •••• ${last4}`, paymentMethod.id);
            return;
          } catch (err) {
            setStripeError(err.message || "Error tokenizing card with Stripe.js.");
            setStripeProcessing(false);
            return;
          }
        }

        // Mode C: Interactive Stripe Payment Element Sandbox (Default when no API key is entered yet)
        setTimeout(() => {
          const digits = cardNumber.replace(/\D/g, "");
          if (stripePaymentTab === "card") {
            if (digits.endsWith("0002")) {
              setStripeError("Stripe Test Decline (card_declined): Your card was declined. Please try another card such as 4242 4242 4242 4242.");
              setStripeProcessing(false);
              return;
            }
            if (digits.endsWith("9995")) {
              setStripeError("Stripe Test Decline (insufficient_funds): Your card has insufficient funds.");
              setStripeProcessing(false);
              return;
            }
            if (digits.length < 15) {
              setStripeError("Your card number is incomplete.");
              setStripeProcessing(false);
              return;
            }
          }

          const simPiId = `pi_3Q${Math.random().toString(36).substring(2, 10).toUpperCase()}`;
          const last4 = digits.slice(-4) || "4242";
          const methodLabel =
            stripePaymentTab === "apple_pay"
              ? "Stripe Apple Pay"
              : stripePaymentTab === "google_pay"
              ? "Stripe Google Pay"
              : stripePaymentTab === "link"
              ? "Stripe Link Instant Pay"
              : `Stripe •••• ${last4}`;

          handlePlaceOrder("ONLINE", methodLabel, simPiId);
        }, 650);
      };

      // Advance KDS Order Status (Stamps completedAt when handed off to guest as PICKED_UP)
      const advanceOrderStatus = (orderId) => {
        const flow = {
          QUEUED: "MAKE_LINE",
          MAKE_LINE: "IN_OVEN",
          IN_OVEN: "READY",
          READY: "PICKED_UP"
        };
        const nowStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        setOrders(prev =>
          prev.map(o => {
            if (o.id !== orderId) return o;
            const nextStatus = flow[o.status] || "PICKED_UP";
            return {
              ...o,
              status: nextStatus,
              completedAt: nextStatus === "PICKED_UP" ? (o.completedAt || nowStr) : o.completedAt
            };
          })
        );
      };

      // Toast KDS: Toggle 🚨 RUSH / VIP Priority on an active ticket
      const toggleOrderRush = (orderId) => {
        setOrders(prev => prev.map(o => (o.id === orderId ? { ...o, isRush: !o.isRush } : o)));
      };

      // Toast KDS: Recall most recently completed (PICKED_UP) ticket back to READY shelf
      const recallLastCompletedOrder = () => {
        setOrders(prev => {
          const idx = prev.findIndex(o => o.status === "PICKED_UP");
          if (idx === -1) return prev;
          return prev.map((o, i) => (i === idx ? { ...o, status: "READY" } : o));
        });
      };

      // Toast Accounting: Toggle Refund / Void on an order
      const toggleRefundOrder = (orderId) => {
        setOrders(prev => prev.map(o => (o.id === orderId ? { ...o, refunded: !o.refunded } : o)));
      };

      // Toast KDS: All-Day Item Counts across all open kitchen tickets (QUEUED, MAKE_LINE, IN_OVEN)
      const allDayKitchenCounts = useMemo(() => {
        const map = {};
        orders
          .filter(o => o.status === "QUEUED" || o.status === "MAKE_LINE" || o.status === "IN_OVEN")
          .forEach(order => {
            (order.items || []).forEach(item => {
              const qty = Number(item.quantity) || 1;
              if (!map[item.id]) {
                map[item.id] = { id: item.id, name: item.name, qty: 0, station: item.station || "PIZZA" };
              }
              map[item.id].qty += qty;
            });
          });
        return Object.values(map).sort((a, b) => b.qty - a.qty);
      }, [orders]);

      // ========================================================================
      // ACCOUNTING, PRODUCT UTILIZATION & NIGHTLY Z-REPORT ARCHIVE ENGINE
      // ========================================================================
      const computeOrderFinancials = (order) => {
        if (order.refunded) {
          return { subtotal: 0, taxAmount: 0, tipAmount: 0, totalAmount: 0, itemCount: 0, discountAmount: 0 };
        }
        const calcSub = (order.items || []).reduce((s, i) => s + (Number(i.price) || 0) * (Number(i.quantity) || 1), 0);
        const subtotal = typeof order.subtotal === "number" ? order.subtotal : Number(calcSub.toFixed(2));
        const discountAmount = typeof order.discountAmount === "number" ? order.discountAmount : 0;
        const taxAmount = typeof order.taxAmount === "number" ? order.taxAmount : Number((subtotal * 0.06625).toFixed(2));
        const tipAmount = typeof order.tipAmount === "number" ? order.tipAmount : Number((subtotal * 0.18).toFixed(2));
        const totalAmount = typeof order.totalAmount === "number"
          ? order.totalAmount
          : Number((subtotal + taxAmount + tipAmount).toFixed(2));
        const itemCount = (order.items || []).reduce((s, i) => s + (Number(i.quantity) || 1), 0);
        return { subtotal, taxAmount, tipAmount, totalAmount, itemCount };
      };

      const buildAccountingSummaryForOrders = (targetOrders) => {
        let netSales = 0;
        let taxCollected = 0;
        let tipsCollected = 0;
        let grossRevenue = 0;
        let onlineRevenue = 0;
        let posRevenue = 0;
        let totalItemsSold = 0;

        const menuUsageMap = {};
        const ingredientUsageMap = {};

        targetOrders.forEach(order => {
          const fin = computeOrderFinancials(order);
          netSales += fin.subtotal;
          taxCollected += fin.taxAmount;
          tipsCollected += fin.tipAmount;
          grossRevenue += fin.totalAmount;
          totalItemsSold += fin.itemCount;

          if (order.source === "ONLINE") {
            onlineRevenue += fin.totalAmount;
          } else {
            posRevenue += fin.totalAmount;
          }

          (order.items || []).forEach(item => {
            const qty = Number(item.quantity) || 1;
            const rev = (Number(item.price) || 0) * qty;
            if (!menuUsageMap[item.id]) {
              menuUsageMap[item.id] = {
                id: item.id,
                name: item.name,
                category: item.category || "Menu",
                qty: 0,
                revenue: 0
              };
            }
            menuUsageMap[item.id].qty += qty;
            menuUsageMap[item.id].revenue += rev;

            const invMap = item.inventoryUsage || {};
            Object.entries(invMap).forEach(([invId, reqUnits]) => {
              // Track base dough and prep ingredients (skip duplicate self-id menu entries)
              if (invId === item.id) return;
              const invObj = inventory.find(x => x.id === invId);
              const usedCount = (Number(reqUnits) || 0) * qty;
              if (usedCount <= 0) return;
              if (!ingredientUsageMap[invId]) {
                ingredientUsageMap[invId] = {
                  id: invId,
                  name: invObj ? invObj.name : invId,
                  category: invObj ? invObj.category : "PREP",
                  unit: invObj ? invObj.unit : "units",
                  qtyUsed: 0
                };
              }
              ingredientUsageMap[invId].qtyUsed += usedCount;
            });
          });
        });

        const utilizedMenuItems = Object.values(menuUsageMap).sort((a, b) => b.qty - a.qty || b.revenue - a.revenue);
        const utilizedIngredients = Object.values(ingredientUsageMap).sort((a, b) => b.qtyUsed - a.qtyUsed);

        return {
          orderCount: targetOrders.length,
          totalItemsSold,
          netSales: Number(netSales.toFixed(2)),
          taxCollected: Number(taxCollected.toFixed(2)),
          tipsCollected: Number(tipsCollected.toFixed(2)),
          grossRevenue: Number(grossRevenue.toFixed(2)),
          onlineRevenue: Number(onlineRevenue.toFixed(2)),
          posRevenue: Number(posRevenue.toFixed(2)),
          avgOrderValue: targetOrders.length > 0 ? Number((grossRevenue / targetOrders.length).toFixed(2)) : 0,
          utilizedMenuItems,
          utilizedIngredients
        };
      };

      const completedOrdersList = useMemo(
        () => orders.filter(o => o.status === "PICKED_UP"),
        [orders]
      );

      const accountingOrdersToAnalyze = useMemo(
        () => (accountingFilterMode === "COMPLETED_ONLY" ? completedOrdersList : orders),
        [accountingFilterMode, completedOrdersList, orders]
      );

      const liveAccountingSummary = useMemo(
        () => buildAccountingSummaryForOrders(accountingOrdersToAnalyze),
        [accountingOrdersToAnalyze, inventory]
      );

      const closeOutNightAndArchiveSummary = (e) => {
        if (e && e.preventDefault) e.preventDefault();
        const targetOrdersForNight = orders.length > 0 ? orders : [];
        const completedCount = orders.filter(o => o.status === "PICKED_UP").length;
        const summary = buildAccountingSummaryForOrders(
          accountingFilterMode === "COMPLETED_ONLY" && completedCount > 0
            ? orders.filter(o => o.status === "PICKED_UP")
            : targetOrdersForNight
        );

        const archiveId = `Z-${new Date().toISOString().slice(0, 10)}-${Math.floor(100 + Math.random() * 900)}`;
        const newReport = {
          id: archiveId,
          dateLabel: closeoutDateLabel.trim() || `Shift Closeout (${new Date().toLocaleDateString()})`,
          closedAt: new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }),
          managerNote:
            closeoutManagerNote.trim() ||
            `End-of-night Z-Report generated. ${summary.orderCount} orders (${summary.totalItemsSold} items) totaled $${summary.grossRevenue.toFixed(2)}.`,
          completedOrdersCount: completedCount,
          totalOrdersCount: orders.length,
          totalItemsSold: summary.totalItemsSold,
          netSales: summary.netSales,
          taxCollected: summary.taxCollected,
          tipsCollected: summary.tipsCollected,
          grossRevenue: summary.grossRevenue,
          onlineRevenue: summary.onlineRevenue,
          posRevenue: summary.posRevenue,
          utilizedMenuItems: summary.utilizedMenuItems,
          utilizedIngredients: summary.utilizedIngredients
        };

        setNightlyArchive(prev => [newReport, ...prev]);

        link.setAttribute("href", encodedUri);
